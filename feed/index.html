<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="イベントフィード">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<title>関西イベント フィード</title>
<style>
  :root{
    --accent:#c62828; --heart:#d81b60; --oshi:#6a1b9a; --gold:#b7791f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;overflow:hidden;background:#000;color:#fff;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;line-height:1.55}
  a{color:inherit}
  button{font:inherit;cursor:pointer}

  /* ---------- 上部バー ---------- */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:50;background:linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.28) 70%,rgba(0,0,0,0));padding-top:env(safe-area-inset-top)}
  .topbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px 18px}
  .topbar h1{margin:0;font-size:15px;font-weight:800;letter-spacing:.02em;text-shadow:0 1px 6px rgba(0,0,0,.6);white-space:nowrap}
  .topbar .spacer{flex:1}
  .topbar .count{font-size:12px;color:rgba(255,255,255,.85);text-shadow:0 1px 4px rgba(0,0,0,.6);white-space:nowrap}
  .topbar .guide-link{display:inline-flex;align-items:center;min-height:36px;padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(20,20,20,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
  .topbar .guide-link:active{transform:scale(.97)}
  button.guide-link{font-family:inherit;cursor:pointer}

  /* ---------- フィード本体 ---------- */
  .feed{height:100vh;height:100dvh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
  .feed::-webkit-scrollbar{display:none}
  @media (min-width:600px){
    .feed{max-width:560px;margin:0 auto;box-shadow:0 0 0 1px #262626}
  }
  .card{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#111}
  .card .fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:88px 26px 150px;gap:14px}
  .card .fb-cat{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.14em;padding:5px 14px;border-radius:999px;background:rgba(0,0,0,.32);color:#fff}
  .card .fb-title{font-size:30px;font-weight:800;line-height:1.4;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.35);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
  .card .fb-date{font-size:15px;font-weight:700;color:rgba(255,255,255,.92)}
  .card img.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .card .overlay{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:72px 84px calc(18px + env(safe-area-inset-bottom)) 16px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.52) 46%,rgba(0,0,0,.85));color:#fff}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.22);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:#fff;white-space:nowrap}
  .badge.pend{background:var(--accent)}
  .badge.fav{background:var(--heart)}
  .badge.want{background:var(--accent)}
  .badge.int{background:var(--gold)}
  .badge.oshi{background:var(--oshi)}
  .badge.now{background:rgba(255,255,255,.92);color:#111}
  .card .rail{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;gap:12px;align-items:center}
  .rail-btn{display:flex;flex-direction:column;align-items:center;gap:2px;width:60px;padding:9px 2px 7px;border:none;border-radius:16px;background:rgba(0,0,0,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:#fff;cursor:pointer}
  .rail-glyph{font-size:21px;line-height:1}
  .rail-label{font-size:10px;font-weight:700;white-space:nowrap}
  .rail-btn.fav.on{background:var(--heart)}
  .rail-btn.want.on{background:var(--accent)}
  .rail-btn.int.on{background:var(--gold)}
  .rail-btn.pop{animation:railpop .25s ease}
  @keyframes railpop{40%{transform:scale(1.14)}}
  .rail-btn.list.on{background:#5b50c6}
  /* リストのスコープ切り替え（v80連携）: トップバー下のチップ行 */
  .scopebar{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 10px;max-width:560px;margin:0 auto;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
  .scopebar::-webkit-scrollbar{display:none}
  .searchbar{display:flex;gap:6px;align-items:center;padding:0 14px 4px;max-width:560px;margin:0 auto}
  .searchbar input{flex:1;min-width:0;min-height:42px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(20,20,20,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:14.5px;font-family:inherit;padding:8px 16px;outline:none}
  .searchbar input::placeholder{color:rgba(255,255,255,.65)}
  .searchbar button{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(20,20,20,.45);color:#fff;font-size:15px;cursor:pointer;font-family:inherit}
  .searchbar button.hidden{display:none}
  .search-note{max-width:560px;margin:0 auto;padding:0 16px 8px;font-size:12.5px;color:rgba(255,255,255,.9);text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .search-note.hidden{display:none}
  .notice-strip{display:flex;align-items:center;gap:8px;width:calc(100% - 28px);max-width:532px;margin:0 auto 8px;min-height:42px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(20,20,20,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-family:inherit;font-size:13.5px;padding:7px 14px;cursor:pointer;text-align:left}
  .notice-strip.hidden{display:none}
  .notice-strip .ns-kicker{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:#f2c14e}
  .notice-strip .ns-badge{flex:none;background:#e0342b;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:2px 7px}
  .notice-strip .ns-badge.hidden{display:none}
  .notice-strip .ns-title{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .notice-strip .ns-go{flex:none;opacity:.85}
  .notice-list{padding:4px 2px 10px}
  .notice-item{border-top:1px solid rgba(255,255,255,.14);padding:11px 0}
  .notice-item:first-child{border-top:0}
  .notice-item .ni-date{font-size:12px;opacity:.7}
  .notice-item h3{margin:3px 0 5px;font-size:15px}
  .notice-item p{margin:0 0 6px;font-size:13.5px;line-height:1.65;white-space:pre-wrap}
  .notice-item a{font-weight:700}
  .scopebar button{flex:0 0 auto;border:1px solid rgba(255,255,255,.45);background:rgba(20,20,20,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;min-height:34px;white-space:nowrap;cursor:pointer;font-family:inherit;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .scopebar button.on{background:#f4f2ec;color:#141414;border-color:#f4f2ec;text-shadow:none}
  /* リスト選択シート */
  .lp-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80}
  .lp-sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;max-width:560px;margin:0 auto;background:#17181d;color:#f4f2ec;border-radius:18px 18px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.5);max-height:72dvh;overflow-y:auto}
  .lp-sheet.hidden,.lp-backdrop.hidden{display:none}
  .lp-sheet.tall{max-height:88dvh}
  .dt-img{width:100%;border-radius:12px;margin-bottom:10px}
  .dt-title{font-size:17px;margin:2px 0 8px;line-height:1.45}
  .dt-row{font-size:13.5px;opacity:.92;margin-bottom:5px}
  .dt-sec{font-size:11.5px;font-weight:800;letter-spacing:.08em;opacity:.7;margin:12px 0 4px}
  .dt-text{font-size:14px;line-height:1.65}
  .dt-text.pre{white-space:pre-wrap;word-break:break-word}
  .dt-links{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .dt-links a{border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:7px 14px;color:#fff;text-decoration:none;font-size:13px;font-weight:700}
  .dt-acts{display:flex;gap:7px;margin-top:14px}
  .dt-act{flex:1;min-height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#f4f2ec;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .dt-act.on{background:#f4f2ec;color:#0e0f12}
  .lp-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .lp-head h2{margin:0;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lp-close{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;width:36px;height:36px;font-size:15px;cursor:pointer}
  .lp-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#f4f2ec;border-radius:12px;padding:12px;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit}
  .lp-row .lp-check{margin-left:auto;font-size:15px;color:#8be0a4;min-width:20px;text-align:center}
  .lp-none{color:rgba(255,255,255,.65);font-size:13.5px;margin:10px 2px 2px}
  .lp-new{display:flex;gap:8px;margin-top:14px}
  .lp-new input{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:10px;color:#fff;padding:10px 12px;font-size:15px;font-family:inherit}
  .lp-new button{flex:0 0 auto;border:none;border-radius:10px;background:#f4f2ec;color:#141414;font-weight:800;padding:10px 14px;font-size:13.5px;cursor:pointer;font-family:inherit}
  .ev-title{margin:0 0 6px;font-size:22px;font-weight:800;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 8px rgba(0,0,0,.5)}
  .ev-date{font-size:15px;font-weight:700;margin-bottom:4px}
  .ev-meta{font-size:14px;color:rgba(255,255,255,.94);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .detail-btn{display:inline-flex;align-items:center;justify-content:center;margin-top:12px;min-height:48px;padding:12px 24px;border-radius:999px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;text-decoration:none;box-shadow:0 4px 16px rgba(0,0,0,.35)}
  .detail-btn:active{transform:scale(.98)}
  .card.end{display:flex;align-items:center;justify-content:center;background:#141414}
  .end-in{text-align:center;padding:32px 26px;max-width:420px}
  .end-in h2{font-size:20px;margin:0 0 10px}
  .end-in p{font-size:14px;color:rgba(255,255,255,.8);margin:0 0 8px}
  .ghost-btn{display:inline-flex;align-items:center;justify-content:center;margin-top:12px;margin-left:8px;min-height:48px;padding:12px 20px;border-radius:999px;background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;font-size:14px;font-weight:700}
  .ghost-btn:active{transform:scale(.98)}

  /* ---------- 状態表示（読み込み中・エラー・0件） ---------- */
  .state{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px;font-size:15px;color:rgba(255,255,255,.92)}
  .state .reload-btn{min-height:48px;padding:12px 26px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-size:15px;font-weight:800}
  .state a{color:#fff;font-weight:700}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin 0.9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <h1>関西イベント フィード</h1>
  <span class="spacer"></span>
  <span class="count" id="count"></span>
  <button class="guide-link" id="kg-account-open" type="button">ログイン / 同期</button>
  <a class="guide-link" href="../">ガイドを開く</a>
</div>
<div class="scopebar" id="scopeBar" role="group" aria-label="フィードに流す範囲の切り替え"></div>
<div class="searchbar"><input id="feedSearchInput" type="search" inputmode="search" placeholder="イベント・会場・出演者で検索" autocomplete="off" aria-label="イベントを検索"><button type="button" id="feedSearchClear" class="hidden" aria-label="検索を解除">✕</button></div>
<div class="search-note hidden" id="feedSearchNote"></div>
<button type="button" class="notice-strip hidden" id="noticeStrip"><span class="ns-kicker">お知らせ</span><span class="ns-badge hidden" id="noticeNew">NEW</span><span class="ns-title" id="noticeTitle"></span><span class="ns-go">›</span></button>
</header>

<div class="lp-backdrop hidden" id="lpBackdrop"></div>
<div class="lp-sheet hidden" id="lpSheet" role="dialog" aria-modal="true" aria-label="リストに追加">
  <div class="lp-head"><h2 id="lpTitle">リストに追加</h2><button class="lp-close" type="button" id="lpClose" aria-label="閉じる">✕</button></div>
  <div id="lpBody"></div>
</div>
<div class="lp-backdrop hidden" id="noticeBackdrop"></div>
<div class="lp-sheet hidden" id="noticeSheet" role="dialog" aria-modal="true" aria-label="お知らせ一覧">
  <div class="lp-head"><h2>お知らせ</h2><button class="lp-close" type="button" id="noticeClose" aria-label="閉じる">✕</button></div>
  <div id="noticeList" class="notice-list"></div>
</div>
<div class="lp-backdrop hidden" id="detailBackdrop"></div>
<div class="lp-sheet tall hidden" id="detailSheet" role="dialog" aria-modal="true" aria-label="イベントの詳細">
  <div class="lp-head"><h2>イベント詳細</h2><button class="lp-close" type="button" id="detailClose" aria-label="閉じる">✕</button></div>
  <div id="detailBody"></div>
</div>
<main class="feed" id="feed" style="display:none"></main>
<div class="state" id="state"><div class="spinner" aria-hidden="true"></div><div>読み込み中…</div></div>
<noscript><div class="state"><div>このページは JavaScript が必要です。<br><a href="../">ガイドを開く</a></div></div></noscript>
<script>
(function(){

/* ---------- gviz parsing（本体 parseGvizObject の再実装・fields 引数化） ---------- */
function cellText(cell){
  if(!cell) return "";
  if(cell.f!=null && cell.f!=="") return String(cell.f);
  if(cell.v==null) return "";
  return String(cell.v);
}
function normalizeDate(raw){
  if(raw==null) return "";
  var s=String(raw).trim(); if(!s) return "";
  var m=s.match(/Date\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  if(m){ return m[1]+"-"+String(+m[2]+1).padStart(2,"0")+"-"+String(+m[3]).padStart(2,"0"); }
  m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m){ return m[1]+"-"+String(+m[2]).padStart(2,"0")+"-"+String(+m[3]).padStart(2,"0"); }
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(m){ return m[3]+"-"+String(+m[1]).padStart(2,"0")+"-"+String(+m[2]).padStart(2,"0"); }
  var d=new Date(s);
  if(!isNaN(d.getTime())){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  return s;
}
function parseSheetBool(v){
  if(v==null) return null;
  var s=String(v).trim().toLowerCase();
  if(s==="") return false;
  if(s==="true"||s==="1"||s==="yes"||s==="○"||s==="はい") return true;
  if(s==="false"||s==="0"||s==="no"||s==="×"||s==="いいえ") return false;
  return null;
}
function rawCellValue(cell){
  if(!cell) return "";
  if(cell.v!=null && typeof cell.v==="string" && cell.v.indexOf("Date(")===0) return cell.v;
  return cellText(cell);
}
function parseGviz(text, fields){
  var start=text.indexOf("{"), end=text.lastIndexOf("}");
  if(start<0||end<start) throw new Error("想定外の応答形式でした");
  return parseGvizObject(JSON.parse(text.slice(start,end+1)), fields);
}
function parseGvizObject(json, FIELDS){
  if(!json||typeof json!=="object") throw new Error("想定外の応答形式でした");
  if(json.status==="error") throw new Error("シート側でエラーが返されました");
  var table=json.table; if(!table||!table.rows) throw new Error("イベント表が見つかりませんでした");
  var cols=table.cols||[];
  var labels=cols.map(function(c){ return (c&&c.label?String(c.label):"").trim(); });
  var rows=table.rows.slice();
  var headers=labels;
  var labelsEmpty = labels.every(function(l){ return !l; }) || labels.filter(Boolean).length < 3;
  if(labelsEmpty && rows.length){
    headers = (rows[0].c||[]).map(function(cell){ return cellText(cell).trim(); });
    rows = rows.slice(1);
  }
  var idx={};
  headers.forEach(function(h,i){ if(h && idx[h]==null) idx[h]=i; });
  FIELDS.forEach(function(f){ if(idx[f]==null){
    for(var k in idx){ if(k.toLowerCase()===f.toLowerCase()){ idx[f]=idx[k]; break; } }
  }});
  var hasIsFreeCol = idx["isFree"]!=null;
  var hasPriceClassCol = idx["priceClass"]!=null;
  var events=[];
  rows.forEach(function(r){
    var c=r.c||[]; var ev={};
    FIELDS.forEach(function(f){
      var i=idx[f]; var val = (i==null)? "" : rawCellValue(c[i]);
      ev[f]= (val==null? "" : String(val).trim());
    });
    var vsIdx = idx["venueSpaceNote"]!=null ? idx["venueSpaceNote"] : (idx["venueSupp"]!=null ? idx["venueSupp"] : idx["会場補足"]);
    ev.sheetVs = vsIdx==null ? "" : String(rawCellValue(c[vsIdx])||"").trim();
    ev._freeSheet = hasIsFreeCol ? parseSheetBool(ev.isFree) : null;
    var pcRaw = hasPriceClassCol ? String(ev.priceClass||"").trim().toLowerCase() : null;
    ev._pcSheet = pcRaw==null ? null : ((pcRaw==="paid"||pcRaw==="free"||pcRaw==="drink"||pcRaw==="partial") ? pcRaw : "");
    if(!ev.title && !ev.id) return;
    ev.date = normalizeDate(ev.date);
    ev.dateEnd = ev.dateEnd ? normalizeDate(ev.dateEnd) : "";
    if(ev.dateEnd && ev.dateEnd===ev.date) ev.dateEnd="";
    var sm=parseInt(ev.startMin,10); ev.startMin = isNaN(sm)? null : sm;
    var em=parseInt(ev.endMin,10); ev.endMin = isNaN(em)? null : em;
    ev._perfList = splitPerfs(ev.performers||"");
    events.push(ev);
  });
  events.sort(function(a,b){
    if(a.date!==b.date) return a.date<b.date?-1:1;
    var as=a.startMin==null?99999:a.startMin, bs=b.startMin==null?99999:b.startMin;
    return as-bs;
  });
  return events;
}
var PERF_SPLIT_PROTECT=["ジョニー・デッパ","と、いうわけで"];
function splitPerfs(s){
  if(!s) return [];
  var work=String(s), holders=[];
  PERF_SPLIT_PROTECT.forEach(function(name,i){
    if(work.indexOf(name)>=0){ holders[i]=name; work=work.split(name).join("\u0001"+i+"\u0002"); }
  });
  return work.split(/[、,，\n\/|／｜]/).map(function(x){return x.trim();}).filter(Boolean).map(function(x){
    return x.replace(/\u0001(\d)\u0002/g, function(m,d){ return holders[+d]||m; });
  });
}

function todayStr(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function addDays(ds,n){
  var m=String(ds||"").match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return ds;
  var d=new Date(+m[1],+m[2]-1,+m[3]+n);

}
function normPriceText(s){ return String(s||"").replace(/\s+/g,""); }
function textPriceClassOf(ev){
  var t=normPriceText(ev.price);
  if(!t) return null;
  if(/要確認|未定|未記載/.test(t) && !/無料/.test(t)) return null;
  var amounts=[]; var re=/¥(\d[\d,]*)|(\d[\d,]*)円/g; var m;
  while((m=re.exec(t))!==null){
    var v=parseInt(String(m[1]!=null?m[1]:m[2]).replace(/,/g,""),10);
    if(isNaN(v)) continue;
    var before=t.slice(Math.max(0,m.index-14),m.index);
    amounts.push({v:v, drink:/ドリンク|[12]D$|1ドリンク/.test(before)||/ドリンク代/.test(before)});
  }
  var paidAmounts=amounts.filter(function(a){ return a.v>0 && !a.drink; });
  var hasFree=/無料/.test(t);
  if(hasFree && paidAmounts.length>0) return "partial";
  if(hasFree){
    var onlyDrink = amounts.length>0 && amounts.every(function(a){ return a.v===0 || a.drink; });
    if(onlyDrink && amounts.some(function(a){ return a.drink && a.v>0; })) return "drink";
    return "free";
  }
  if(amounts.length>0 && amounts.every(function(a){ return a.drink; }) && amounts.some(function(a){ return a.v>0; })) return "drink";
  if(paidAmounts.length>0) return "paid";
  return null;
}
function priceClassOf(ev){
  if(ev && ev._pcSheet!=null) return ev._pcSheet ? ev._pcSheet : null;
  var tc=textPriceClassOf(ev);
  if(tc==="partial") return "paid";
  return tc;
}
function isFreeEvent(ev){
  if(ev && ev._freeSheet!=null) return ev._freeSheet===true;
  var tc=textPriceClassOf(ev);
  return tc==="free" || tc==="drink";
}
/* 祝日判定（本体と同一の決定的計算） */
var _holCache={};
function jpHolidaySet(year){
  if(_holCache[year]) return _holCache[year];
  var set={};
  function ds(m,d){ return year+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
  function add(m,d){ set[ds(m,d)]=1; }
  add(1,1); add(2,11); add(2,23); add(4,29); add(5,3); add(5,4); add(5,5); add(8,11); add(11,3); add(11,23);
  function nthMon(m,n){ var d=new Date(year,m-1,1); var off=(8-d.getDay())%7; return 1+off+(n-1)*7; }
  add(1,nthMon(1,2)); add(7,nthMon(7,3)); add(9,nthMon(9,3)); add(10,nthMon(10,2));
  var yb=year-1980;
  add(3, Math.floor(20.8431+0.242194*yb)-Math.floor(yb/4));
  add(9, Math.floor(23.2488+0.242194*yb)-Math.floor(yb/4));
  Object.keys(set).slice().forEach(function(k){
    var mm=k.match(/^(\d{4})-(\d{2})-(\d{2})/); var d=new Date(+mm[1],+mm[2]-1,+mm[3]);
    if(d.getDay()===0){ var nx=addDays(k,1), guard=0; while(set[nx] && guard++<5) nx=addDays(nx,1); set[nx]=1; }
  });
  Object.keys(set).slice().forEach(function(k){
    var mid=addDays(k,1);
    if(!set[mid] && set[addDays(k,2)]){
      var mm=mid.match(/^(\d{4})-(\d{2})-(\d{2})/); var dd=new Date(+mm[1],+mm[2]-1,+mm[3]);
      if(dd.getDay()!==0) set[mid]=1;
    }
  });
  _holCache[year]=set; return set;
}
function isHoliday(ds){ var m=String(ds||"").match(/^(\d{4})/); if(!m) return false; return !!jpHolidaySet(+m[1])[ds]; }
function evOverlapsWeekendOrHoliday(ev){
  if(!ev.date) return false;
  var ds=ev.date, end=effectiveEnd(ev), guard=0;
  while(ds<=end && guard++<400){
    var m=ds.match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) break;
    var dow=new Date(+m[1],+m[2]-1,+m[3]).getDay();
    if(dow===0 || dow===6 || isHoliday(ds)) return true;
    ds=addDays(ds,1);
  }
  return false;
}

var HW_DAKU={"カ":"ガ","キ":"ギ","ク":"グ","ケ":"ゲ","コ":"ゴ","サ":"ザ","シ":"ジ","ス":"ズ","セ":"ゼ","ソ":"ゾ","タ":"ダ","チ":"ヂ","ツ":"ヅ","テ":"デ","ト":"ド","ハ":"バ","ヒ":"ビ","フ":"ブ","ヘ":"ベ","ホ":"ボ","ウ":"ヴ"};
var HW_HANDAKU={"ハ":"パ","ヒ":"ピ","フ":"プ","ヘ":"ペ","ホ":"ポ"};
function hwKana(s){
  if(!/[\uFF66-\uFF9F]/.test(s)) return s;
  var out="";
  for(var i=0;i<s.length;i++){
    var c=s.charAt(i), idx=HW_KANA_FROM.indexOf(c);
    if(idx>=0){
      var fw=HW_KANA_TO.charAt(idx), nx=s.charAt(i+1);
      if(nx==="ﾞ" && HW_DAKU[fw]){ fw=HW_DAKU[fw]; i++; }
      else if(nx==="ﾟ" && HW_HANDAKU[fw]){ fw=HW_HANDAKU[fw]; i++; }
      out+=fw;
    } else if(c==="ﾞ" || c==="ﾟ"){ }
    else out+=c;
  }
  return out;
}
function normSearch(s){
  return hwKana(String(s||"")).toLowerCase()
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); })
    .replace(/[ァ-ヶ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); })
    .replace(/[ぁぃぅぇぉゃゅょっゎゕゖ]/g, function(c){ return "あいうえおやゆよつわかけ".charAt("ぁぃぅぇぉゃゅょっゎゕゖ".indexOf(c)); })
    .replace(/[・･]/g, "");
}

function scoreEventFor(ev, pv){
  var s=0;
  var cats=evCategories(ev);
  if(cats.some(function(c){ return pv.cats.indexOf(c)>=0; })) s+=4;
  if((ev._perfList||[]).some(function(p){ return pv.artists.indexOf(p)>=0; })) s+=6;
  if(pv.prefs.indexOf(ev.prefecture)>=0 || (ev.area && pv.areas.indexOf(ev.area)>=0)) s+=3;
  if(pv.free && isFreeEvent(ev)) s+=2.5;
  if(pv.weekend && evOverlapsWeekendOrHoliday(ev)) s+=2;
  if(pv.collab && isCollabCafe(ev)) s+=4;
  if(ev.date){
    var dd=Math.round((new Date(ev.date+"T00:00:00")-new Date(todayStr()+"T00:00:00"))/86400000);
    if(dd<=0) s+=3; else s+=Math.max(0, 3-dd*0.12);
  }
  var lw=0;
  cats.forEach(function(c){ lw+=Math.min(learn.cats[c]||0,12)*0.25; });
  (ev._perfList||[]).forEach(function(p){ lw+=Math.min(learn.artists[p]||0,12)*0.3; });
  if(ev.prefecture) lw+=Math.min(learn.areas[ev.prefecture]||0,12)*0.2;
  if(ev.area) lw+=Math.min(learn.areas[ev.area]||0,12)*0.2;
  s+=Math.min(lw,6);
  return s;
}

  ["title","date","dateEnd","timeLabel","startMin","endMin","venue","sheetVs","area","prefecture","category","categories","price","performers","description","linkWeb","linkTicket","linkX","linkInstagram","organizerName","imageUrl","_freeSheet","_pcSheet"].forEach(function(k){ out[k]=ev[k]; });
  out.id=base.id;

function pendingReflectedIn(sheetEv, f){
  return !!sheetEv && sheetEv.title===(f.title||"") && sheetEv.date===(f.date||"") && (sheetEv.venue||"")===(f.venue||"") && (sheetEv.timeLabel||"")===(f.timeLabel||"");
}
function mergePendingEvents(sheetEvents){
  var list=loadPendings();
  if(!list.length) return sheetEvents;
  var now=Date.now(), kept=[], out=null, pruned=false;
  list.forEach(function(p){
    if(!p || !p.ev || !p.ts || (now-p.ts)>PENDING_TTL_MS){ pruned=true; return; }
    if(p.kind==="edit" && p.targetId){
      var base=null;
      for(var i=0;i<sheetEvents.length;i++){ if(String(sheetEvents[i].id)===String(p.targetId)){ base=sheetEvents[i]; break; } }
      if(!base){ pruned=true; return; }
      if(pendingReflectedIn(base, p.ev)){ pruned=true; return; }
      kept.push(p);
      if(!out) out=sheetEvents.slice();
      for(var j=0;j<out.length;j++){ if(String(out[j].id)===String(p.targetId)){ out[j]=pendingOverlayObject(base, p); break; } }
    } else {
      var reflected=sheetEvents.some(function(ev){ return pendingReflectedIn(ev, p.ev); });
      if(reflected){ pruned=true; return; }
      kept.push(p);
      if(!out) out=sheetEvents.slice();
      out.push(pendingEventObject(p));
    }
  });
  if(pruned) savePendings(kept);
  return out||sheetEvents;
}

var loadSeq=0;

function loadViaJsonp(sheetName, fields, done, fail){
  var cbName="__kgFeedCb"+(++loadSeq);

  function finish(events, err){
    if(settled) return; settled=true;
    clearTimeout(timer);
    if(pendingSheetHandler===handler) pendingSheetHandler=null;
    try{ delete window[cbName]; }catch(e){ window[cbName]=undefined; }
    if(script.parentNode) script.parentNode.removeChild(script);
    if(err) fail(err); else done(events);
  }
  function handler(resp){
    try{ finish(parseGvizObject(resp, fields), null); }
    catch(e){ finish(null, e); }
  }
  window[cbName]=handler;
  pendingSheetHandler=handler;
  try{
    window.google = window.google || {};
    window.google.visualization = window.google.visualization || {};
    window.google.visualization.Query = window.google.visualization.Query || {};
    window.google.visualization.Query.setResponse = function(resp){ if(pendingSheetHandler) pendingSheetHandler(resp); };
  }catch(e){}

function loadSheetRace(sheetName, fields, ok, failAll){
  var settled=false, jsonpFailed=false, fetchStarted=false, fetchFailed=false, hedgeTimer=null;
  function done(events){ if(settled) return; settled=true; if(hedgeTimer) clearTimeout(hedgeTimer); ok(events); }
  function fail(err){ if(settled) return; settled=true; if(hedgeTimer) clearTimeout(hedgeTimer); failAll(err); }
  function maybeFail(err){
    if(settled) return;
    if(jsonpFailed && fetchFailed){
      loadViaJsonp(sheetName, fields, done, function(e2){ fail(e2||err); });
    }
  }
  function startFetch(){
    if(fetchStarted || settled) return; fetchStarted=true;
    loadViaFetch(sheetName, fields, done, function(e){ fetchFailed=true; maybeFail(e); });
  }
  loadViaJsonp(sheetName, fields, done, function(e){ jsonpFailed=true; startFetch(); maybeFail(e); });
  hedgeTimer=setTimeout(startFetch, 6000);
}

/* ---------- 並び順（本体タイムラインと同じ思想＋行きたい／気になる段） ---------- */
function byDate(a,b){
  if(a.date!==b.date) return a.date<b.date?-1:1;
  var as=a.startMin==null?99999:a.startMin, bs=b.startMin==null?99999:b.startMin;
  return as-bs;
}
function buildFeedItems(events){
  var up=events.filter(function(ev){ return !isEnded(ev); });
  var ss=feedScopeSet();
  if(ss) up=up.filter(function(ev){ return ss.has(String(ev.id)); });
  /* フォロー中は日付順／新着順の切り替え（本体タイムラインと同仕様、v82/v83） */
  if(feedScope==="p:follow"){
    if(feedFSort==="new") up.sort(function(a,b){ return feedIdNum(b)-feedIdNum(a); });
    else up.sort(byDate);
    return up.slice(0,60);
  }
  var pend=[], favs=[], wants=[], ints=[], oshi=[], scored=[], rest=[];
  up.forEach(function(ev){
    if(ev._pending) pend.push(ev);
    else if(favEvents.has(String(ev.id))) favs.push(ev);
    else if(wantEvents.has(String(ev.id))) wants.push(ev);
    else if(intEvents.has(String(ev.id))) ints.push(ev);
    else if(hasOshi(ev)) oshi.push(ev);
    else {
      var s=scoreEvent(ev);
      if(s>0) scored.push({ev:ev, s:s});
      else rest.push(ev);
    }
  });
  pend.sort(byDate); favs.sort(byDate); wants.sort(byDate); ints.sort(byDate); oshi.sort(byDate);
  scored.sort(function(a,b){ if(b.s!==a.s) return b.s-a.s; return byDate(a.ev,b.ev); });
  rest.sort(byDate);
  return pend.concat(favs, wants, ints, oshi, scored.map(function(x){ return x.ev; }), rest).slice(0,60);
}

  else if(ev.date===addDays(todayStr(),1)) b.push('<span class="badge now">明日開催</span>');
  return '<div class="badges" data-badges="1">'+b.join("")+'</div>';
}
function railHTML(ev){
  var id=String(ev.id);
  function btn(act, set, glyph, label){
    var on=set.has(id);
    return '<button type="button" class="rail-btn '+act+(on?" on":"")+'" data-act="'+act+'" aria-pressed="'+(on?"true":"false")+'" aria-label="'+label+'"><span class="rail-glyph">'+glyph+'</span><span class="rail-label">'+label+'</span></button>';
  }
  return '<div class="rail">'
    + btn("fav", favEvents, "♥", "お気に入り")
    + btn("want", wantEvents, "✓", "行きたい")
    + btn("int", intEvents, "●", "気になる")
    + '<button type="button" class="rail-btn list'+(inAnyList(id)?" on":"")+'" data-list="1" aria-label="リストに追加"><span class="rail-glyph">＋</span><span class="rail-label">リスト</span></button>'
    + '</div>';
}
function cardHTML(ev, idx){
  var hasImg=!!ev.imageUrl;
  var perfs=ev._perfList||[];
  var perfLine=perfs.length? perfs.slice(0,4).join("、")+(perfs.length>4?" ほか":"") : "";
  var fb='<div class="fallback" style="background:'+catColor(ev.category)+'">'
    + '<span class="fb-cat">'+esc(ev.category||"イベント")+'</span>'
    + '<div class="fb-title">'+esc(ev.title)+'</div>'
    + '<div class="fb-date">'+esc(dateLabel(ev))+(ev.timeLabel?' '+esc(ev.timeLabel):"")+'</div>'
    + '</div>';
  var media=hasImg? '<img class="media" src="'+esc(ev.imageUrl)+'" alt="" '+(idx<2?"":'loading="lazy" ')+'data-fbk="'+esc(ev.id)+':0" onerror="evImgErr(this)">' : "";
  var overlay='<div class="overlay">'
    + badgesHTML(ev)
    + (hasImg? '<h2 class="ev-title">'+esc(ev.title)+'</h2>'
      + '<div class="ev-date">'+esc(dateLabel(ev))+(ev.timeLabel?'　'+esc(ev.timeLabel):"")+'</div>' : "")
    + (ev.venue? '<div class="ev-meta">'+esc(ev.venue)+'</div>' : "")
    + (ev.price? '<div class="ev-meta">'+esc(ev.price)+'</div>' : "")
    + (perfLine? '<div class="ev-meta">'+esc(perfLine)+'</div>' : "")
    + '<button type="button" class="detail-btn" data-detail="1">詳細を見る</button>'
    + '</div>';
  return '<section class="card" data-idx="'+idx+'" aria-label="'+esc(ev.title)+'">'+fb+media+overlay+railHTML(ev)+'</section>';
}
function endCardHTML(){
  return '<section class="card end"><div class="end-in">'
    + '<h2>ここまでがフィードです</h2>'
    + '<p>あなたの推し・お気に入り・行きたい・気になる・好みから選んだイベントを表示しました。</p>'
    + '<p><a class="detail-btn" href="../">ガイドを開く</a><button type="button" class="ghost-btn" id="feedAgain">最初から見る</button></p>'
    + '</div></section>';
}
function updateCount(){
  countEl.textContent = feedItems.length? ((curIdx+1)+" / "+feedItems.length) : "";
}
function observeCards(){
  if(io) io.disconnect();
  if(!("IntersectionObserver" in window)) return;
  io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){
        var i=parseInt(en.target.getAttribute("data-idx"),10);
        if(!isNaN(i)){ curIdx=i; updateCount(); kgFeedSave(); }
      }
    });
  }, {root: feedEl, threshold: 0.6});
  var cards=feedEl.querySelectorAll(".card[data-idx]");
  for(var i=0;i<cards.length;i++) io.observe(cards[i]);
}
function showState(html){
  feedEl.style.display="none";
  stateEl.style.display="flex";
  stateEl.innerHTML=html;
}
function renderFeed(keepIdx){
  kgFeedRestoreKick();
  var searchRes = feedQuery? buildSearchItems(allEvents) : null;
  feedItems = searchRes? searchRes.items : buildFeedItems(allEvents);
  updateSearchNote(searchRes);
  if(!feedItems.length){
    if(searchRes){
      showState('<div>「'+esc(feedQuery)+'」に一致するイベントがありませんでした。</div><div><button type="button" class="reload-btn" id="searchReset">検索を解除する</button></div>');
      var xr=document.getElementById("searchReset");
      if(xr) xr.addEventListener("click", function(){ clearFeedSearch(); });
    } else if(feedScope){
      showState('<div>この範囲には表示できるイベントがありません。</div><div><button type="button" class="reload-btn" id="scopeReset">すべての範囲で見る</button></div>');
      var sr=document.getElementById("scopeReset");
      if(sr) sr.addEventListener("click", function(){ setFeedScope(""); renderScopeBar(); renderFeed(false); });
    } else {
      showState('<div>表示できるイベントがありませんでした。</div><div><a href="../">ガイドを開く</a></div>');
    }
    countEl.textContent="";
    return;
  }
  stateEl.style.display="none";
  feedEl.style.display="";
  feedEl.innerHTML=feedItems.map(function(ev, i){ return cardHTML(ev, i); }).join("")+(searchRes? endCardSearchHTML() : endCardHTML());
  var target=keepIdx? Math.min(curIdx, feedItems.length-1) : 0;
  curIdx=target;
  feedEl.scrollTop=target*feedEl.clientHeight;
  updateCount();
  observeCards();
  var again=document.getElementById("feedAgain");
  if(again) again.addEventListener("click", function(){ feedEl.scrollTo({top:0, behavior:"smooth"}); });
  var sce=document.getElementById("searchClearEnd");
  if(sce) sce.addEventListener("click", function(){ clearFeedSearch(); });
}

/* ---------- 表示範囲（リスト）の切り替え ---------- */
var scopeBarEl=document.getElementById("scopeBar");
function renderScopeBar(){
  if(feedScope && feedScope.indexOf("p:")!==0 && !findFeedList(feedScope)) setFeedScope("");
  var chip=function(v, label){ return '<button type="button" data-scope="'+esc(v)+'" class="'+(feedScope===v?"on":"")+'">'+esc(label)+'</button>'; };
  scopeBarEl.innerHTML=chip("", "すべて")+chip("p:fav", "お気に入り")+chip("p:want", "行きたい")+chip("p:int", "気になる")+chip("p:follow", "フォロー中")
    + myLists.map(function(l){ return chip(String(l.id), l.name||"無題のリスト"); }).join("")
    + (feedScope==="p:follow" ? '<button type="button" data-fsort="1">並び：'+(feedFSort==="new"?"新着順":"開催日順")+'</button>' : "");
}
scopeBarEl.addEventListener("click", function(e){
  var sb=(e.target && e.target.closest)? e.target.closest("[data-fsort]") : null;
  if(sb){
    feedFSort = feedFSort==="new" ? "date" : "new";
    try{ localStorage.setItem(LS_FEED_FSORT, feedFSort); }catch(err){}
    renderScopeBar();
    renderFeed(false);
    return;
  }
  var b=(e.target && e.target.closest)? e.target.closest("[data-scope]") : null;
  if(!b) return;
  if(feedQuery){ feedQuery=""; var si=document.getElementById("feedSearchInput"); if(si) si.value=""; updateSearchNote(null); }
  setFeedScope(b.getAttribute("data-scope")||"");
  renderScopeBar();
  renderFeed(false);
});

/* ---------- 検索バーの操作 ---------- */
(function(){
  var inp=document.getElementById("feedSearchInput");
  var clr=document.getElementById("feedSearchClear");
  if(inp){
    var deb=null;
    inp.addEventListener("input", function(){

/* ---------- イベント詳細シート（フィード内で開く） ---------- */
var detailSheet=document.getElementById("detailSheet"), detailBackdrop=document.getElementById("detailBackdrop"), detailBody=document.getElementById("detailBody"), detailEv=null;
function closeFeedDetail(){ detailSheet.classList.add("hidden"); detailBackdrop.classList.add("hidden"); detailEv=null; }
function openFeedDetail(ev){
  detailEv=ev;
  var id=String(ev.id);
  function actBtn(act, set, glyph, label){ var on=set.has(id); return '<button type="button" class="dt-act'+(on?' on':'')+'" data-dact="'+act+'">'+glyph+' '+label+'</button>'; }
  var links=[];

    (ev.imageUrl? '<img class="dt-img" src="'+esc(ev.imageUrl)+'" alt="" data-fbk="'+esc(ev.id)+':0" onerror="evImgErr(this)">' : '')

    + '<div class="dt-row">'+esc(dateLabel(ev))+(ev.timeLabel? '　'+esc(ev.timeLabel) : '')+'</div>'
    + (ev.venue? '<div class="dt-row">'+esc(ev.venue)+(ev.venueSpaceNote && String(ev.venue).indexOf(ev.venueSpaceNote)<0? '（'+esc(ev.venueSpaceNote)+'）' : '')+'</div>' : '')
    + (ev.price? '<div class="dt-row">'+esc(ev.price)+'</div>' : '')

    + (ev.organizerName? '<div class="dt-sec">主催</div><div class="dt-text">'+esc(ev.organizerName)+'</div>' : '')
    + (ev.description? '<div class="dt-sec">詳細</div><div class="dt-text pre">'+esc(ev.description)+'</div>' : '')

    + '<div class="dt-acts">'+actBtn("fav", favEvents, "♥", "お気に入り")+actBtn("want", wantEvents, "✓", "行きたい")+actBtn("int", intEvents, "●", "気になる")+'</div>';

document.getElementById("detailClose").addEventListener("click", closeFeedDetail);
detailBackdrop.addEventListener("click", closeFeedDetail);
detailBody.addEventListener("click", function(e){

});

var lpSheet=document.getElementById("lpSheet"), lpBackdrop=document.getElementById("lpBackdrop"), lpBody=document.getElementById("lpBody"), lpTitle=document.getElementById("lpTitle");

document.getElementById("lpClose").addEventListener("click", closeListPicker);

/* ---------- カード上のクイックアクション（詳細を開かずに付け外し） ---------- */
feedEl.addEventListener("click", function(e){
  var lb=(e.target && e.target.closest)? e.target.closest("[data-list]") : null;
  if(lb){
    var lcard=lb.closest(".card"); if(!lcard) return;

  }
  var b=(e.target && e.target.closest)? e.target.closest("[data-act]") : null;
  if(!b) return;
  var card=b.closest(".card"); if(!card) return;
  var idx=parseInt(card.getAttribute("data-idx"),10);
  var ev=feedItems[idx]; if(!ev) return;
  var id=String(ev.id), act=b.getAttribute("data-act");
  var set= act==="fav"? favEvents : act==="want"? wantEvents : intEvents;
  var key= act==="fav"? LS_FAV : act==="want"? LS_WANT : LS_INT;
  if(set.has(id)) set.delete(id); else set.add(id);
  saveSet(key, set);
  card.querySelectorAll("[data-act]").forEach(function(x){
    var a=x.getAttribute("data-act");
    var s= a==="fav"? favEvents : a==="want"? wantEvents : intEvents;
    var on=s.has(id);
    x.classList.toggle("on", on);
    x.setAttribute("aria-pressed", on?"true":"false");
    if(x===b && on){ x.classList.remove("pop"); void x.offsetWidth; x.classList.add("pop"); }
  });
  var bd=card.querySelector("[data-badges]");

});

/* ---------- ログイン・同期との橋渡し（本体と同じ account.js を使う） ---------- */
window.KGAccountBridge = {
  keys: { event: LS_FAV, artist: LS_OSHI },
  read: function(){ return { event: Array.from(favEvents), artist: Array.from(favPerfs) }; },
  replace: function(data){
    favEvents = new Set((data && data.event) || []);
    favPerfs = new Set((data && data.artist) || []);
    try{
      localStorage.setItem(LS_FAV, JSON.stringify(Array.from(favEvents)));
      localStorage.setItem(LS_OSHI, JSON.stringify(Array.from(favPerfs)));
    }catch(e){}
    if(sheetEvents){ allEvents=mergePendingEvents(sheetEvents); renderScopeBar(); renderFeed(true); }
  }
};

/* ---------- 起動 ---------- */
/* シート分割（月別タブ）への段階対応（v101・本体と共通）:
   読み込み元は ../assets/sheet-sources.json で差し替え可能。既定は現行の
   単一構成。月別タブが用意されたら sources に足すだけで、全ソースを
   id でマージして読む。1ソース失敗しても残りで表示を続ける */
var feedSourcesCache=null;
function loadFeedSourcesConfig(done){
  if(feedSourcesCache){ done(feedSourcesCache); return; }
  var settled=false;
  function fin(list){ if(settled) return; settled=true; feedSourcesCache=list; done(list); }
  var DEFAULT_SOURCES=[{lite:"events_lite", details:"events_details"}];
  try{
    var ctl=("AbortController" in window)?new AbortController():null;
    var tm=ctl?setTimeout(function(){ ctl.abort(); },6000):null;
    fetch("../assets/sheet-sources.json", ctl?{signal:ctl.signal}:undefined).then(function(r){ if(tm)clearTimeout(tm); if(!r.ok) throw new Error("sheet-sources"); return r.json(); }).then(function(j){
      var list=(j && Array.isArray(j.sources))? j.sources.filter(function(s){ return s && s.lite; }) : [];
      fin(list.length? list : DEFAULT_SOURCES);
    }).catch(function(){ if(tm)clearTimeout(tm); fin(DEFAULT_SOURCES); });
  }catch(e){ fin(DEFAULT_SOURCES); }
}
function start(){
  renderScopeBar();
  showState('<div class="spinner" aria-hidden="true"></div><div>読み込み中…</div>');
  loadFeedSourcesConfig(function(sources){
    var liteResults=new Array(sources.length), liteDone=0, liteOk=0;
    sources.forEach(function(src, si){
      loadSheetRace(src.lite, LITE_FIELDS, function(events){ liteResults[si]=events||[]; liteOk++; stepLite(); }, function(){ liteResults[si]=null; stepLite(); });
    });
    function stepLite(){
      if(++liteDone<sources.length) return;
      if(!liteOk){
        showState('<div>読み込めませんでした。再読み込みしてください。</div><div><button type="button" class="reload-btn" onclick="location.reload()">再読み込み</button></div>');
        return;
      }
      var byId={}, order=[];
      liteResults.forEach(function(list){ (list||[]).forEach(function(ev){ if(!ev || ev.id==null) return; var k=String(ev.id); if(!(k in byId)) order.push(k); byId[k]=ev; }); });
      sheetEvents=order.map(function(k){ return byId[k]; });
      allEvents=mergePendingEvents(sheetEvents);
      renderFeed(false);
      var detResults=new Array(sources.length), detDone=0, detOk=0;
      sources.forEach(function(src, si){
        if(!src.details){ detResults[si]=[]; stepDet(); return; }
        loadSheetRace(src.details, DETAIL_FIELDS, function(det){ detResults[si]=det||[]; detOk++; stepDet(); }, function(){ detResults[si]=null; stepDet(); });
      });
      function stepDet(){
        if(++detDone<sources.length) return;
        if(!detOk) return; /* 詳細が取れなくても lite だけで表示を続ける */
        var allDet=[];
        detResults.forEach(function(l){ if(l) allDet=allDet.concat(l); });
        sheetEvents=mergeDetails(sheetEvents, allDet);
        allEvents=mergePendingEvents(sheetEvents);
        renderFeed(true);
      }
    }
  });
}
  /* ---------- フィードの表示状態の保存と復元 (v120) ---------- */
  var kgFeedUiDone=false;
  function kgFeedSave(){ try{ localStorage.setItem("kg_feed_ui_v1", JSON.stringify({q:feedQuery, idx:curIdx})); }catch(e){} }
  window.addEventListener("pagehide", kgFeedSave);
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden") kgFeedSave(); });
  function kgFeedRestoreKick(){
    if(kgFeedUiDone) return;
    if(!feedItems.length) return;
    kgFeedUiDone=true;
    setTimeout(kgFeedRestore, 50);
  }
  function kgFeedRestore(){
    var st=null; try{ st=JSON.parse(localStorage.getItem("kg_feed_ui_v1")||"null"); }catch(e){}
    if(!st) return;
    if(st.q && feedQuery!==st.q){
      var inp=document.getElementById("feedSearchInput");
      if(inp) inp.value=st.q;
      feedQuery=st.q;
      renderFeed(false);
    }
    var ix=Math.max(0, Math.min(st.idx||0, feedItems.length-1));
    if(ix>0){ curIdx=ix; var fe=document.getElementById("feed"); if(fe) fe.scrollTop=ix*fe.clientHeight; updateCount(); }
  }
/* 本体側で お気に入り等 が変わったら並びを追随させる */
window.addEventListener("storage", function(e){
  if(!sheetEvents) return;
  if(e.key===LS_FAV||e.key===LS_OSHI||e.key===LS_WANT||e.key===LS_INT||e.key===LS_LEARN||e.key===LS_PREFS||e.key===LS_PENDING||e.key===LS_LISTS||e.key===LS_FOLLOWS){
    favEvents=loadSet(LS_FAV); favPerfs=loadSet(LS_OSHI); wantEvents=loadSet(LS_WANT); intEvents=loadSet(LS_INT);
    prefs=loadPrefsLite(); learn=loadLearn();
    myLists=loadLists(); feedFollows=loadFeedFollows(); renderScopeBar();
    allEvents=mergePendingEvents(sheetEvents);
    renderFeed(true);
  }
});
if("serviceWorker" in navigator){
  try{ navigator.serviceWorker.register("./feed-worker.js", {updateViaCache:"none"}).catch(function(){}); }catch(e){}
}
loadFeedDict();
loadFeedNotices();
start();
})();
